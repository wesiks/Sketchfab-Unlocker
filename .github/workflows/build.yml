name: Build

# Builds the desktop app with PyInstaller for Linux and Windows.
#  - Run it manually from the Actions tab (workflow_dispatch) to get the zips as artifacts.
#  - Push a tag like v2.1.0 to also publish them in a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            exe: SketchfabUnlocker
            webview_extra: qt
          - name: windows
            os: windows-latest
            exe: SketchfabUnlocker.exe
            webview_extra: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libnss3 libasound2 \
            libxkbcommon0 libxkbcommon-x11-0 libxkbfile1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libxtst6

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          if [ "${{ matrix.webview_extra }}" = "qt" ]; then pip install "pywebview[qt]"; fi

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/SketchfabUnlocker.spec
          ls -la dist

      - name: Assemble package
        shell: bash
        run: |
          pkg="SketchfabUnlocker-${{ matrix.name }}-x86_64"
          mkdir -p "release/$pkg"
          cp "dist/${{ matrix.exe }}" "release/$pkg/"
          # The app looks for tools/ next to the executable (main.py: ROOT).
          cp -r tools "release/$pkg/tools"
          rm -f "release/$pkg/tools/wasm/static_key.txt"
          cp README.md LICENSE "release/$pkg/"
          cd release
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a -tzip "$pkg.zip" "$pkg" > /dev/null
            echo "ASSET=release/$pkg.zip" >> "$GITHUB_ENV"
          else
            chmod +x "$pkg/${{ matrix.exe }}"
            tar -czf "$pkg.tar.gz" "$pkg"
            echo "ASSET=release/$pkg.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SketchfabUnlocker-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
